name: release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-14
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1
      - if: runner.os == 'Linux'
        shell: bash
        run: docker version
      - if: runner.os == 'Linux'
        shell: bash
        run: sh ./scripts/build-linux-wheel.sh
      - if: runner.os != 'Linux'
        shell: bash
        run: sh ./scripts/build-native.sh
      - if: runner.os != 'Linux'
        shell: bash
        run: python -m pip install setuptools wheel
      - if: runner.os != 'Linux'
        shell: bash
        run: python setup.py bdist_wheel
      - shell: bash
        run: python -m pip install twine
      - shell: bash
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tlsrequests
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
