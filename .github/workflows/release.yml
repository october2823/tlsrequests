name: release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
            file: tlsrequests.so
            platform: manylinux_2_28_x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact: windows
            file: tlsrequests.dll
            platform: win_amd64
            target: x86_64-pc-windows-gnu
          - os: macos-14
            artifact: macos
            file: tlsrequests.dylib
            platform: macosx_11_0_arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@v2
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1
      - if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y gcc
      - if: runner.os != 'Windows'
        shell: bash
        run: sh ./scripts/build-native.sh
      - shell: bash
        run: python -m pip install build wheel twine
      - shell: bash
        run: python setup.py bdist_wheel --plat-name ${{ matrix.platform }}
      - shell: bash
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tlsrequests
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
