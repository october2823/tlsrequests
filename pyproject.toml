[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlsrequests"
version = "0.1.0"
description = "Async Python facade for bogdanfinn/tls-client"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools]
packages = ["tlsrequests"]
include-package-data = true

[tool.setuptools.package-data]
tlsrequests = ["py.typed", "*.so", "*.dylib", "*.dll"]
